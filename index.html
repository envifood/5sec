<!-- Резервные веб-шрифты, пока не подключён локальный файл airballoon.woff2 (см. @font-face ниже) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#333333;
    --text:#FAFBDB;
    --link:#F3A245;
    --heading:#E76D34;
    --line-1:#8ECCA3;
    --line-2:#993399;
    --bg-card:#3d3d3a;
    --font-head:'Pangolin', system-ui, cursive;
    --font-body:'Mulish', system-ui, -apple-system, sans-serif;
    --radius:14px;
    --maxw:1180px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle 480px at 50% 0%, rgba(231,109,52,.12), transparent 70%),
      var(--bg);
    background-repeat:no-repeat;
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.55;
    min-height:100vh;
  }
  body.modal-open, html.modal-open{overflow:hidden;}
  h1,h2,h3,h4{
    font-family:var(--font-head);
    color:var(--heading);
    letter-spacing:.3px;
    margin:0 0 .5em;
    font-weight:700;
  }
  a{color:var(--link); text-decoration:none;}
  a:hover{text-decoration:underline;}
  button{font-family:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ================= HEADER ================= */
  header.site-header{
    position:sticky; top:0; z-index:50;
    background:rgba(30,30,30,.92);
    backdrop-filter:blur(8px);
    border-bottom:2px solid var(--line-1);
  }
  .header-inner{
    max-width:var(--maxw); margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; flex-shrink:0;}
  .brand img{height:56px; width:56px; object-fit:contain;}

  nav.main-nav{display:flex; gap:4px; flex-wrap:wrap;}
  nav.main-nav a{
    display:flex; align-items:center; gap:7px;
    color:var(--text); font-weight:600; font-size:.92rem;
    padding:8px 12px; border-radius:10px;
    white-space:nowrap;
  }
  nav.main-nav a img{width:20px; height:20px; object-fit:contain;}
  nav.main-nav a:hover{background:rgba(142,204,163,.14); text-decoration:none; color:var(--line-1);}
  nav.main-nav a.active{background:rgba(231,109,52,.18); color:var(--heading);}

  @media (max-width: 640px){
    .wrap{padding:0 18px;}
    .page-section{padding-top:28px; padding-bottom:50px;}

    .header-inner{padding:14px 14px; gap:8px; flex-wrap:nowrap;}
    .brand img{height:34px; width:34px; object-fit:contain;}
    nav.main-nav{gap:2px;}
    nav.main-nav a{padding:8px 12px; font-size:.9rem; gap:6px;}
    nav.main-nav a img{width:14px; height:14px; object-fit:contain;}
  }

  /* ================= PAGE / HERO ================= */
  main{min-height:60vh;}
  .page-section{padding-top:40px; padding-bottom:70px;}
  .eyebrow{
    color:var(--line-1); font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; font-size:.75rem; margin-bottom:8px; display:block;
  }

  .films-header-row{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px 16px; margin-bottom:.5em;
  }
  .films-header-row h1{margin:0;}
  .add-link{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--text); font-weight:700; font-size:.9rem; flex-shrink:0;
    padding:8px 14px; border-radius:10px; background:rgba(142,204,163,.14);
  }
  .add-link img{width:20px; height:20px; object-fit:contain;}
  .add-link:hover{background:rgba(142,204,163,.26); text-decoration:none; color:var(--line-1);}

  .hero{padding-top:30px; padding-bottom:20px; text-align:center;}
  .hero h1{font-size:clamp(1.9rem, 4vw, 2.9rem); margin-bottom:6px;}
  .hero p.lede{color:#d9d9c8; max-width:640px; margin:0 auto 30px;}

  .player-card{
    max-width:900px; margin:0 auto;
    background:var(--bg-card);
    border:1px solid #4c4c46;
    border-radius:var(--radius);
    padding:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .player-frame{
    position:relative; width:100%; padding-top:56.25%;
    background:#111; border-radius:10px; overflow:hidden;
  }
  .player-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  .btn-random{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:22px; padding:10px 20px; border-radius:999px;
    border:1px solid var(--line-1); color:var(--line-1); background:transparent;
    cursor:pointer; font-weight:700; font-size:.9rem; text-decoration:none;
  }
  .btn-random:hover{background:rgba(142,204,163,.14); text-decoration:none;}

  .home-outro{
    max-width:640px; margin:30px auto 0; text-align:left;
  }
  .home-outro p{color:#d9d9c8;}

  .home-intro{
    max-width:640px; margin:0 auto 26px; text-align:left;
  }
  .home-intro p{color:#d9d9c8;}

  /* ---- Настройки страницы «Поток» ---- */
  .stream-settings{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    gap:12px; max-width:640px; margin:0 auto 22px;
  }

  .stream-filter{ position:relative; }
  .stream-filter summary{
    list-style:none; cursor:pointer; user-select:none;
    display:inline-flex; align-items:center; gap:6px;
    background:#2a2a2a; border:1px solid #55554f; border-radius:999px;
    padding:8px 16px; font-size:.9rem; color:var(--text);
  }
  .stream-filter summary::-webkit-details-marker{display:none;}
  .stream-filter summary::after{content:'▾'; color:var(--line-1); font-size:.8em;}
  .stream-filter[open] summary::after{content:'▴';}
  .stream-filter summary span{color:var(--line-1); font-weight:700;}
  .stream-filter summary:hover{border-color:var(--link);}

  .stream-filter-panel{
    position:absolute; top:calc(100% + 8px); left:0; z-index:20;
    background:#2b2b28; border:1px solid #55554f; border-radius:12px;
    padding:10px 0; min-width:230px; max-height:320px; overflow-y:auto;
    box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .stream-filter-option{
    display:flex; align-items:center; gap:10px;
    padding:8px 16px; font-size:.9rem; color:var(--text); cursor:pointer;
  }
  .stream-filter-option:hover{background:rgba(243,162,69,.1);}
  .stream-filter-option input{accent-color:var(--link); width:16px; height:16px; flex-shrink:0;}
  .stream-filter-all{font-weight:700; color:var(--line-1);}
  .stream-filter-divider{height:1px; background:#4c4c46; margin:6px 0;}

  .segmented-toggle{
    display:inline-flex; background:#2a2a2a; border:1px solid #55554f; border-radius:999px; padding:3px;
  }
  .segmented-toggle .segmented-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:0; background:transparent; color:#b8b8ac; cursor:pointer;
    padding:6px 14px; border-radius:999px; font-size:.9rem; font-weight:600;
  }
  .segmented-toggle .segmented-btn.active{background:rgba(243,162,69,.18); color:var(--link);}
  .segmented-toggle .segmented-btn:hover:not(.active){color:var(--text);}
  .segmented-toggle .segmented-btn img{width:16px; height:16px; display:block; opacity:.55; object-fit:contain;}
  .segmented-toggle .segmented-btn.active img{opacity:1;}

  .stream-adult-toggle{
    display:inline-flex; align-items:center; gap:7px;
    background:#2a2a2a; border:1px solid #55554f; border-radius:999px;
    padding:8px 16px; font-size:.9rem; color:var(--text); cursor:pointer; user-select:none;
  }
  .stream-adult-toggle input{accent-color:var(--link); width:16px; height:16px; flex-shrink:0;}
  .stream-adult-toggle:hover{border-color:var(--link);}

  .player-card.stream-empty{
    text-align:center; padding:40px 20px; color:#b8b8ac;
  }

  @media (max-width:640px){
    .stream-settings{gap:8px;}
    .stream-filter summary{padding:7px 14px; font-size:.85rem;}
    .segmented-toggle .segmented-btn{padding:6px 11px; font-size:.85rem;}
    .stream-adult-toggle{padding:7px 14px; font-size:.85rem;}
  }

  .mobile-divider{display:none;}
  @media (max-width:640px){
    .mobile-divider{
      display:block; height:1px; background:#4c4c46; border:0;
      max-width:640px; margin:24px auto;
    }
  }

  .home-actions{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; margin-top:22px;
  }
  .home-actions .btn-random{margin-top:0;}
  .btn-icon-only{
    padding:0; width:40px; height:40px; justify-content:center; flex-shrink:0;
  }
  .btn-icon-only img{width:18px; height:18px; object-fit:contain;}

  @media (max-width:640px){
    .home-actions{gap:8px;}
    .home-actions .btn-random{padding:7px 14px; font-size:.8rem; gap:6px;}
    .home-actions .btn-icon-only{width:34px; height:34px; padding:0;}
    .home-actions .btn-icon-only img{width:15px; height:15px; object-fit:contain;}
  }

  .social-with-image{
    display:flex; gap:28px; align-items:center; margin-top:24px;
  }
  .social-with-image .social-links{flex:1; margin-top:0; min-width:0;}
  .social-with-image img.banner{
    flex:1; max-width:260px; border-radius:var(--radius); align-self:stretch; object-fit:cover;
  }
  @media (max-width:640px){
    .social-with-image{flex-direction:column; align-items:stretch;}
    .social-with-image img.banner{max-width:100%;}
  }

  /* Globe / author-page button (используется в таблице фильмов) */
  .globe-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    background:rgba(243,162,69,.14);
    flex-shrink:0;
  }
  .globe-btn img{width:18px; height:18px; object-fit:contain;}
  .globe-btn:hover{background:rgba(243,162,69,.28);}

  /* ================= CONTENT / ABOUT / ADD ================= */
  .content-block{
    display:grid; grid-template-columns:1.1fr .9fr; gap:10px; align-items:center;
    margin-top:8px;
  }
  .content-block img.banner{width:100%; border-radius:var(--radius);}
  .content-block .text p{color:#e4e4d3;}
  @media (max-width:820px){
    .content-block{grid-template-columns:1fr;}
    .content-block .banner{order:-1;}
  }

  .social-links{
    margin-top:34px; display:flex; flex-direction:column; gap:2px;
    border-top:1px solid #4c4c46;
  }
  .social-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 6px; border-bottom:1px solid #4c4c46;
    color:var(--text); font-weight:700; font-size:1rem;
  }
  .social-row:hover{background:rgba(243,162,69,.08); text-decoration:none; color:var(--link);}
  .social-row img{width:28px; height:28px; flex-shrink:0; object-fit:contain;}

  .form-card{
    margin-top:8px; background:var(--bg-card);
    border-radius:var(--radius); padding:20px; text-align:center;
  }
  .form-card iframe{width:100%; min-height:2080px; border:0; border-radius:10px; background:#f5f5f0;}

  @media (max-width:640px){
    .form-card{
      margin-left:-18px; margin-right:-18px; width:auto;
      border-radius:0; padding:0;
    }
    .form-card iframe{border-radius:0;}
    .player-card{padding:0; border:0; background:transparent; box-shadow:none;}
  }

  /* ================= ТАБЛИЦА ФИЛЬМОВ ================= */
  .toolbar{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-bottom:18px;
  }
  .toolbar .count{align-self:flex-end; color:#b8b8ac; font-size:.88rem;}

  .table-search{
    display:flex; align-items:center; gap:8px;
    background:#2a2a2a; border:1px solid #55554f; border-radius:999px;
    padding:0 14px; width:min(300px, 100%); height:38px; box-sizing:border-box;
  }
  .table-search img{width:16px; height:16px; opacity:.8; flex-shrink:0; object-fit:contain;}
  .table-search input{
    background:transparent; border:0; outline:0; color:var(--text);
    font-family:var(--font-body); font-size:.9rem; width:100%;
  }
  .table-search input::placeholder{color:#9c9c92;}

  .search-with-filter{
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
  }

  /* ---- Ползунок диапазона показов ---- */
  .show-slider{
    margin-bottom:22px;
    /* сверху — под год, снизу — под название показа */
    padding-top:38px;
    padding-bottom:28px;
  }

  .ssl-year-label, .ssl-show-label{
    position:absolute; top:50%; text-align:center; white-space:nowrap; pointer-events:none;
  }
  .ssl-year-label{
    font-family:var(--font-head); color:var(--heading); font-size:1.1rem; line-height:1.1;
  }
  .ssl-show-label{color:#b8b8ac; font-size:.76rem;}

  .show-slider-track-wrap{
    position:relative; width:100%; height:38px; touch-action:none;
  }
  .show-slider-track{
    position:absolute; left:0; right:0; top:50%; height:4px;
    background:#55554f; border-radius:2px; transform:translateY(-50%);
  }
  .show-slider-range{
    position:absolute; top:50%; height:4px;
    background:var(--link); border-radius:2px; transform:translateY(-50%);
  }
  .show-slider-ticks{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    display:flex; justify-content:space-between; pointer-events:none;
  }
  .show-slider-ticks span{
    width:2px; height:8px; background:var(--line-1); border-radius:1px; opacity:.7;
  }

  .show-thumb{
    position:absolute; top:50%; width:18px; height:18px; border-radius:50%;
    background:var(--heading); border:2px solid var(--bg);
    box-shadow:0 1px 4px rgba(0,0,0,.4);
    cursor:pointer; touch-action:none;
  }
  .show-thumb:focus-visible{outline:2px solid var(--link); outline-offset:2px;}
  .show-thumb.dragging{cursor:grabbing;}

  @media (max-width:640px){
    .search-with-filter{width:100%; flex-direction:column; align-items:center; gap:10px;}
    .table-search{width:100%;}
    /* На iOS инпут с font-size меньше 16px вызывает автозум при фокусе — держим 16px */
    .table-search input{font-size:16px;}
    .ssl-year-label{font-size:.92rem;}
    .ssl-show-label{font-size:.66rem;}
    /* Дополнительный запас по бокам, чтобы плавающие подписи не упирались в край экрана */
    .show-slider{padding-left:16px; padding-right:16px;}
  }

  table.films-table{
    width:100%; border-collapse:collapse; table-layout:fixed;
    background:var(--bg-card); border-radius:var(--radius); overflow:hidden;
  }
  table.films-table thead th{
    text-align:left; font-family:var(--font-head); font-weight:700;
    color:var(--heading); font-size:.95rem;
    padding:14px 16px; border-bottom:2px solid var(--line-1);
    cursor:pointer; user-select:none; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  table.films-table thead th .arrow{opacity:0; margin-left:5px; font-size:.75em;}
  table.films-table thead th.sorted .arrow{opacity:1; color:var(--line-1);}
  table.films-table thead th:hover{color:var(--link);}
  table.films-table tbody td{
    padding:13px 16px; border-bottom:1px solid #47473f; font-size:.94rem;
    vertical-align:middle; overflow-wrap:break-word;
  }
  table.films-table tbody tr.film-row{cursor:pointer;}
  table.films-table tbody tr.film-row:hover{background:rgba(243,162,69,.09);}
  table.films-table tbody tr.film-row.no-video td{opacity:.5;}
  table.films-table tbody tr:last-child td{border-bottom:0;}
  table.films-table tbody tr.empty-row td{
    text-align:center; color:#9c9c92; padding:24px 16px; cursor:default;
  }
  td.muted{color:#8b8b82;}

  /* Фиксированные ширины колонок — не "прыгают" при поиске/фильтрации */
  th.col-title, td.col-title{width:38%;}
  th.col-author, td.col-author{width:20%;}
  th.col-city, td.col-city{width:18%;}
  th.col-year, td.col-year{width:18%;}
  th.col-globe, td.col-globe{width:6%; text-align:center;}

  /* "Год показа" обрезается многоточием по ширине колонки, как заголовок таблицы */
  td.col-year{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .badge-18{
    display:inline-block; height:22px; width:22px; object-fit:contain;
    vertical-align:middle; margin-left:6px; position:relative; top:-2px;
  }

  /* Город и Год показа освобождают место пошире, чем ссылка на автора */
  @media (max-width:700px){
    .col-city, .col-year{display:none;}
    th.col-title, td.col-title{width:62%;}
    th.col-author, td.col-author{width:32%;}
  }

  /* На маленьком экране прячем и ссылку на автора; таблица (и сортировка
     по Названию/Автору) остаётся */
  @media (max-width:640px){
    .col-globe{display:none;}
    th.col-title, td.col-title{width:60%;}
    th.col-author, td.col-author{width:40%;}
    table.films-table{
      border-radius:0;
      /* Полноширинная таблица независимо от контента: table-layout:fixed требует
         ЗАДАННОЙ ширины, иначе браузер вычисляет её по содержимому и она "скачет" */
      width:100vw;
      margin-left:calc(50% - 50vw);
      margin-right:calc(50% - 50vw);
    }
  }

  /* ================= MODAL (плеер) ================= */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,10,.72);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:200;
  }
  .modal-backdrop.open{display:flex;}
  .modal-box{
    position:relative;
    width:100%; max-width:880px; max-height:92vh; overflow:auto;
    background:var(--bg-card);
    border-radius:var(--radius); padding:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .modal-info{margin-top:16px; text-align:left;}
  .modal-info .mi-title{
    font-family:var(--font-head); color:var(--heading); font-size:1.35rem; margin:0;
  }
  .modal-info .mi-author{font-size:1rem; color:#cfcfc2; margin:0;}
  .mi-show-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;
  }
  .modal-info .mi-show{font-size:.92rem; color:#b8b8ac; margin:0;}
  .modal-info .mi-author a{font-weight:700;}

// Показ определяется по id вида "<слаг-показа>-<номер>" (например "2019-bfm-1" →
// "2019 БФМ"), чтобы не дублировать одну и ту же строку в каждой из тысяч записей
// базы. Если у фильма уже указан show явно (как у части демо-записей выше) —
// он в приоритете и не перезаписывается.
function showFromId(id){
  const m = /^(.+)-\d+$/.exec(id || '');
  const slug = m ? m[1] : '';
  return SLUG_TO_SHOW[slug] || '';
}
FILMS.forEach(f => { f.show = f.show || showFromId(f.id); });

/* ================= РОУТЕР ================= */
const mainEl = document.getElementById('main');
const navLinks = [...document.querySelectorAll('#mainNav a')];
let lastNonFilmHash = '';

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '') || '';
  const path = hash.split('?')[0];
  return path.split('/').filter(Boolean);
}

// Параметры вида #/films?show=...&q=... — фильтр и поиск на странице «Фильмы»
function currentQueryParams(){
  const hash = location.hash.replace(/^#\/?/, '') || '';
  const qIndex = hash.indexOf('?');
  return new URLSearchParams(qIndex >= 0 ? hash.slice(qIndex + 1) : '');
}

function setActiveNav(page){
  navLinks.forEach(a => a.classList.toggle('active', a.dataset.page === page));
}

function route(){
  clearStreamTimer();
  const parts = currentRoute();

  if(parts.length === 0){ closeModal(false); renderHome(); setActiveNav(''); return; }

  const [seg, arg] = parts;
  switch(seg){
    case 'stream': closeModal(false); renderStream(); setActiveNav('stream'); break;
    case 'films': {
      closeModal(false);
      const params = currentQueryParams();
      const fromShow = SLUG_TO_SHOW[params.get('from')];
      const toShow = SLUG_TO_SHOW[params.get('to')];
      sliderLowIdx = (fromShow && SHOW_INDEX[fromShow] !== undefined) ? SHOW_INDEX[fromShow] : 0;
      sliderHighIdx = (toShow && SHOW_INDEX[toShow] !== undefined) ? SHOW_INDEX[toShow] : SHOW_TIMELINE.length - 1;
      if(sliderLowIdx > sliderHighIdx){ const t = sliderLowIdx; sliderLowIdx = sliderHighIdx; sliderHighIdx = t; }
      filmsFilterQuery = params.get('q') || '';
      renderFilmsPage();
      setActiveNav('films');
      break;
    }
    case 'add': closeModal(false); renderAdd(); setActiveNav('add'); break;
    case 'film':
      // открыть фильм модальным окном поверх той страницы, что уже отрисована
      if(!mainEl.dataset.rendered){ renderFilmsPage(); setActiveNav('films'); }
      openFilm(arg);
      break;
    default: closeModal(false); renderHome(); setActiveNav('');
  }
}

// Отдельно отслеживаем предыдущий (не-модальный) адрес, чтобы при закрытии
// модального окна корректно вернуться на ту же страницу, откуда открыли фильм —
// независимо от того, что именно поменяло hash (клик по строке, поиск, модалка).
window.addEventListener('hashchange', (e) => {
  let oldHash = '';
  try{ oldHash = new URL(e.oldURL).hash || ''; } catch(err){}
  if(!oldHash.startsWith('#/film/')) lastNonFilmHash = oldHash;
  route();
});

/* ================= HELPERS ================= */
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fact(v, fallback='—'){ return (v === undefined || v === null || v === '') ? fallback : esc(v); }

// Обрезает строку до max символов, добавляя многоточие (для колонок Название/Автор в таблице)
function truncateText(str, max=40){
  const s = String(str ?? '');
  return s.length > max ? s.slice(0, max) + '…' : s;
}

// Ссылка-заглушка для фильмов, у которых пока нет своего видео на Kinescope
const NO_VIDEO_URL = "https://kinescope.io/jC3rCS4oigwcFusupW61nG";

function kinescopeEmbed(videoId, loop=true){
  const base = videoId ? `https://kinescope.io/embed/${encodeURIComponent(videoId)}` : NO_VIDEO_URL;
  // t=0 — просим плеер начать с начала; "_" — уникальный параметр на каждую загрузку,
  // чтобы плеер не подхватывал запомненную позицию воспроизведения того же ролика
  const nonce = `${Date.now()}${Math.random().toString(36).slice(2, 8)}`;
  return `${base}?autoplay=true&loop=${loop}&t=0&_=${nonce}`;
}

function playerBlock(film, loop=true){
  return `
    <div class="player-frame">
      <iframe src="${kinescopeEmbed(film.videoId, loop)}"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer"
        allowfullscreen title="Видеоплеер: ${esc(film.title)}"></iframe>
    </div>`;
}

/* ================= ПОТОК ================= */
// Бесконечный поток всех фильмов в случайном порядке без повторов; когда база
// заканчивается — перемешивается заново и продолжает показ по кругу. Повтор у
// видео отключён (playerBlock(film, false)), иначе короткие ролики начинали бы
// проигрываться заново перед самым переключением.
//
// Каждому фильму нужно показываться ровно 7 полных секунд, но таймер запускается
// в момент вставки iframe, а не в момент, когда плеер Kinescope реально начинает
// воспроизведение — на загрузку и старт плеера уходит какое-то время, и это время
// "съедало" часть из 7 секунд показа. STREAM_LOAD_BUFFER_MS компенсирует эту
// задержку, добавляя её сверху к времени показа.
const STREAM_FILM_SECONDS = 7000;
const STREAM_LOAD_BUFFER_MS = 2500;
let streamQueue = [];
let streamIndex = 0;
let streamTimer = null;
// Настройки потока: какие показы участвуют и в каком порядке — по умолчанию
// все показы и случайный порядок. Сбрасываются на дефолт при каждом новом
// заходе на страницу (см. начало renderStream).
let streamSelectedShows = new Set(SHOW_TIMELINE);
let streamOrderMode = 'shuffle'; // 'shuffle' | 'sequential'
let streamIncludeAdult = false;

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Фильмы с настоящим видео (без плейсхолдера NO_VIDEO_URL), чей показ выбран в настройках,
// и с учётом настройки 18+ (по умолчанию такие фильмы в поток не включаются)
function eligibleStreamFilms(){
  const allSelected = streamSelectedShows.size >= SHOW_TIMELINE.length;
  return FILMS.filter(f =>
    f.videoId &&
    (allSelected || streamSelectedShows.has(f.show)) &&
    (streamIncludeAdult || !f.adult)
  );
}

function buildStreamQueue(avoidFirstId){
  const eligible = eligibleStreamFilms();
  let ids;
  if(streamOrderMode === 'sequential'){
    ids = eligible.slice().sort((a, b) => collator.compare(a.id, b.id)).map(f => f.id);
  } else {
    ids = shuffleArray(eligible.map(f => f.id));
  }
  // чтобы на стыке циклов не показать один и тот же фильм два раза подряд
  if(avoidFirstId && ids[0] === avoidFirstId && ids.length > 1){
    [ids[0], ids[1]] = [ids[1], ids[0]];
  }
  streamQueue = ids;
  streamIndex = 0;
}

function currentStreamFilm(){
  return FILMS.find(f => f.id === streamQueue[streamIndex]);
}

function scheduleStreamAdvance(){
  clearStreamTimer();
  streamTimer = setTimeout(advanceStream, STREAM_FILM_SECONDS + STREAM_LOAD_BUFFER_MS);
}

function clearStreamTimer(){
  if(streamTimer){ clearTimeout(streamTimer); streamTimer = null; }
}

function advanceStream(){
  if(mainEl.dataset.rendered !== 'stream'){ clearStreamTimer(); return; }
  const lastId = streamQueue[streamIndex];
  streamIndex++;
  if(streamIndex >= streamQueue.length){
    buildStreamQueue(lastId);
  }
  renderStreamPlayerArea();
}

// Обновляет только видео и подпись — вызывается и при первом заходе, и на каждое
// автоматическое переключение. Панель настроек при этом не перерисовывается,
// иначе она бы "мигала" и закрывалась каждые несколько секунд.
function renderStreamPlayerArea(){
  const area = document.getElementById('streamPlayerArea');
  if(!area) return; // пользователь уже ушёл со страницы

  if(streamQueue.length === 0){
    clearStreamTimer();
    area.innerHTML = `<div class="player-card stream-empty"><p>Выберите хотя бы один показ, чтобы начать просмотр.</p></div>`;
    return;
  }

  const film = currentStreamFilm();
  area.innerHTML = `
    <div class="player-card">
      ${playerBlock(film, false)}
      ${filmInfoBlock(film)}
    </div>
  `;
  scheduleStreamAdvance();
}

function bindStreamSettingsEvents(){
  const allCb = document.getElementById('streamShowAll');
  const showCbs = Array.from(document.querySelectorAll('.stream-show-cb'));
  const summaryEl = document.getElementById('streamFilterSummary');

  const onFilterChange = () => {
    if(summaryEl) summaryEl.textContent = streamFilterSummaryText();
    buildStreamQueue();
    renderStreamPlayerArea();
  };

  allCb.addEventListener('change', () => {
    allCb.indeterminate = false;
    showCbs.forEach(cb => { cb.checked = allCb.checked; });
    streamSelectedShows = allCb.checked ? new Set(SHOW_TIMELINE) : new Set();
    onFilterChange();
  });

  showCbs.forEach(cb => {
    cb.addEventListener('change', () => {
      if(cb.checked) streamSelectedShows.add(cb.value);
      else streamSelectedShows.delete(cb.value);
      const allChecked = streamSelectedShows.size === SHOW_TIMELINE.length;
      allCb.checked = allChecked;
      allCb.indeterminate = !allChecked && streamSelectedShows.size > 0;
      onFilterChange();
    });
  });

  document.querySelectorAll('.segmented-toggle .segmented-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('active')) return;
      streamOrderMode = btn.dataset.order;
      document.querySelectorAll('.segmented-toggle .segmented-btn').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      buildStreamQueue();
      renderStreamPlayerArea();
    });
  });

  const adultCb = document.getElementById('streamAdultCb');
  if(adultCb){
    adultCb.addEventListener('change', () => {
      streamIncludeAdult = adultCb.checked;
      buildStreamQueue();
      renderStreamPlayerArea();
    });
  }
}

/* ================= СТРАНИЦА «ФИЛЬМЫ» ================= */
const collator = new Intl.Collator('ru', {numeric: true});
const filmsSortState = {key:'id', dir:1};
let filmsFilterQuery = '';
let filmsOnlyWithVideo = false;
let sliderLowIdx = 0;
let sliderHighIdx = SHOW_TIMELINE.length - 1;

function sortFilms(list, key, dir){
  const arr = [...list];
  arr.sort((a,b) => {
    let va = a[key] ?? ''; let vb = b[key] ?? '';
    return dir * collator.compare(va, vb);
  });
  return arr;
}

function filterFilms(list, query){
  const q = query.trim().toLowerCase();
  if(!q) return list;
  return list.filter(f =>
    f.title.toLowerCase().includes(q) || f.author.toLowerCase().includes(q)
  );
}

// Оставляет только фильмы, чей показ попадает в выбранный диапазон ползунка
// (полный диапазон от начала до конца шкалы — без фильтрации)
function filterByShowRange(list, lowIdx, highIdx){
  if(lowIdx <= 0 && highIdx >= SHOW_TIMELINE.length - 1) return list;
  return list.filter(f => {
    const idx = SHOW_INDEX[f.show];
    return idx !== undefined && idx >= lowIdx && idx <= highIdx;
  });
}

// Разбивает "2025 Бессонница" на ["2025", "Бессонница"] для подписей на концах ползунка
function splitShow(show){
  const spaceIdx = show.indexOf(' ');
  return spaceIdx === -1 ? [show, ''] : [show.slice(0, spaceIdx), show.slice(spaceIdx + 1)];
}

// Отражает текущий поиск/диапазон показов в адресной строке (без добавления записей
// в историю и без перерисовки страницы), чтобы ссылку можно было скопировать и переслать.
function updateFilmsQueryInUrl(){
  const params = new URLSearchParams();
  if(sliderLowIdx > 0) params.set('from', SHOW_SLUGS[SHOW_TIMELINE[sliderLowIdx]]);
  if(sliderHighIdx < SHOW_TIMELINE.length - 1) params.set('to', SHOW_SLUGS[SHOW_TIMELINE[sliderHighIdx]]);
  if(filmsFilterQuery) params.set('q', filmsFilterQuery);
  const qs = params.toString();
  const newHash = '#/films' + (qs ? ('?' + qs) : '');
  if(location.hash !== newHash){
    history.replaceState(null, '', newHash);
    lastNonFilmHash = newHash;
  }
}

function pluralFilms(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return 'фильм';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'фильма';
  return 'фильмов';
}

// Индекс шкалы показов по X-координате указателя внутри трека ползунка
function sliderIdxFromClientX(clientX){
  const wrap = document.querySelector('.show-slider-track-wrap');
  if(!wrap) return 0;
  const rect = wrap.getBoundingClientRect();
  const ratio = rect.width ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
  return Math.round(ratio * (SHOW_TIMELINE.length - 1));
}

// Кастомный (не нативный <input type=range>) бегунок — перетаскивание через Pointer Events
// и управление стрелками с клавиатуры. Нативная пара range-инпутов, наложенных друг на друга,
// на некоторых устройствах "залипала" на краях шкалы — с кастомными бегунками этой проблемы нет.
function bindThumbDrag(thumbEl, isLow){
  const last = SHOW_TIMELINE.length - 1;

  function applyIdx(idx){
    if(isLow){
      sliderLowIdx = Math.min(Math.max(idx, 0), sliderHighIdx);
    } else {
      sliderHighIdx = Math.max(Math.min(idx, last), sliderLowIdx);
    }
    updateSliderUI();
    updateFilmsQueryInUrl();
    drawFilmsTable();
  }

  thumbEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    thumbEl.setPointerCapture(e.pointerId);
    thumbEl.classList.add('dragging');
    applyIdx(sliderIdxFromClientX(e.clientX));

    const onMove = (ev) => applyIdx(sliderIdxFromClientX(ev.clientX));
    const onUp = () => {
      thumbEl.classList.remove('dragging');
      thumbEl.removeEventListener('pointermove', onMove);
      thumbEl.removeEventListener('pointerup', onUp);
      thumbEl.removeEventListener('pointercancel', onUp);
    };
    thumbEl.addEventListener('pointermove', onMove);
    thumbEl.addEventListener('pointerup', onUp);
    thumbEl.addEventListener('pointercancel', onUp);
  });

  thumbEl.addEventListener('keydown', (e) => {
    let idx = isLow ? sliderLowIdx : sliderHighIdx;
    if(e.key === 'ArrowLeft' || e.key === 'ArrowDown') idx -= 1;
    else if(e.key === 'ArrowRight' || e.key === 'ArrowUp') idx += 1;
    else if(e.key === 'Home') idx = 0;
    else if(e.key === 'End') idx = last;
    else return;
    e.preventDefault();
    applyIdx(idx);
  });
}

// Считает точки "рядом", если расстояние между ними меньше ~15% ширины шкалы —
// при таком сближении подписи начинают перекрывать друг друга
function isCloseRange(lowIdx, highIdx, last){
  if(lowIdx === highIdx) return false; // при полном совпадении левая подпись просто скрыта
  return (highIdx - lowIdx) <= Math.max(1, last * 0.15);
}

// Горизонтальный якорь подписи относительно точки:
// - по умолчанию — по центру;
// - если точка на краю шкалы — разворачивается внутрь, чтобы не выйти за пределы экрана;
// - если точки рядом друг с другом — расходятся в стороны (левая подпись влево,
//   правая вправо), чтобы не перекрывать друг друга. Край шкалы в приоритете над "рядом".
function sliderAnchorX(idx, last, isLow, isClose){
  if(isLow){
    if(idx <= 0) return 'calc(0% + 6px)';
    if(isClose) return 'calc(-100% - 6px)';
    return '-50%';
  }
  if(idx >= last) return 'calc(-100% - 6px)';
  if(isClose) return 'calc(0% + 6px)';
  return '-50%';
}

// Отдаёт "верхнему" бегунку приоритет по клику, чтобы ползунок не "залипал",
// когда обе точки совпадают на краю шкалы (иначе клик всегда достаётся другому бегунку)
function updateSliderZIndex(){
  const thumbLow = document.getElementById('thumbLow');
  const thumbHigh = document.getElementById('thumbHigh');
  if(!thumbLow || !thumbHigh) return;
  const last = SHOW_TIMELINE.length - 1;
  if(sliderLowIdx === sliderHighIdx && sliderHighIdx >= last){
    // обе точки в самом конце шкалы — приоритет левой, чтобы её можно было увести влево
    thumbLow.style.zIndex = 3;
    thumbHigh.style.zIndex = 2;
  } else if(sliderLowIdx === sliderHighIdx && sliderLowIdx <= 0){
    // обе точки в самом начале шкалы — приоритет правой, чтобы её можно было увести вправо
    thumbLow.style.zIndex = 2;
    thumbHigh.style.zIndex = 3;
  } else {
    thumbLow.style.zIndex = 2;
    thumbHigh.style.zIndex = 3;
  }
}

// Обновляет положение бегунков, заливки и плавающих подписей ползунка показов
function updateSliderUI(){
  const last = SHOW_TIMELINE.length - 1;
  const pct = i => (i / last) * 100;
  const fill = document.getElementById('sliderRangeFill');
  if(fill){
    fill.style.left = pct(sliderLowIdx) + '%';
    fill.style.right = (100 - pct(sliderHighIdx)) + '%';
  }

  const thumbLow = document.getElementById('thumbLow');
  const thumbHigh = document.getElementById('thumbHigh');
  if(thumbLow){
    thumbLow.style.left = pct(sliderLowIdx) + '%';
    thumbLow.style.transform = 'translate(-50%, -50%)';
    thumbLow.setAttribute('aria-valuenow', sliderLowIdx);
  }
  if(thumbHigh){
    thumbHigh.style.left = pct(sliderHighIdx) + '%';
    thumbHigh.style.transform = 'translate(-50%, -50%)';
    thumbHigh.setAttribute('aria-valuenow', sliderHighIdx);
  }

  const sameShow = sliderLowIdx === sliderHighIdx;
  const fromYearEl = document.getElementById('sliderFromYear');
  const fromShowEl = document.getElementById('sliderFromShow');
  const toYearEl = document.getElementById('sliderToYear');
  const toShowEl = document.getElementById('sliderToShow');

  // Если выбран один показ — левая подпись не нужна (дублировала бы правую)
  if(fromYearEl) fromYearEl.style.display = sameShow ? 'none' : '';
  if(fromShowEl) fromShowEl.style.display = sameShow ? 'none' : '';

  const fromX = sliderAnchorX(sliderLowIdx, last, true, isCloseRange(sliderLowIdx, sliderHighIdx, last));
  const toX = sliderAnchorX(sliderHighIdx, last, false, isCloseRange(sliderLowIdx, sliderHighIdx, last));
  const fromLeft = pct(sliderLowIdx) + '%';
  const toLeft = pct(sliderHighIdx) + '%';

  // Год — по центру над точкой; показ — сразу под точкой, ближе к ней
  // Год — по центру над точкой (сдвинут повыше); показ — под точкой (сдвинут пониже)
  if(fromYearEl){ fromYearEl.style.left = fromLeft; fromYearEl.style.transform = `translate(${fromX}, calc(-50% - 20px))`; }
  if(fromShowEl){ fromShowEl.style.left = fromLeft; fromShowEl.style.transform = `translate(${fromX}, calc(-50% + 20px))`; }
  if(toYearEl){ toYearEl.style.left = toLeft; toYearEl.style.transform = `translate(${toX}, calc(-50% - 20px))`; }
  if(toShowEl){ toShowEl.style.left = toLeft; toShowEl.style.transform = `translate(${toX}, calc(-50% + 20px))`; }

  const [fromYear, fromShow] = splitShow(SHOW_TIMELINE[sliderLowIdx]);
  const [toYear, toShow] = splitShow(SHOW_TIMELINE[sliderHighIdx]);
  const setText = (id, text) => { const el = document.getElementById(id); if(el) el.textContent = text; };
  setText('sliderFromYear', fromYear);
  setText('sliderFromShow', fromShow);
  setText('sliderToYear', toYear);
  setText('sliderToShow', toShow);

  updateSliderZIndex();
}

      <td class="col-title" title="${esc(f.title)}">${esc(truncateText(f.title))}${adultBadge(f)}</td>
      <td class="col-author" title="${esc(f.author)}">${esc(truncateText(f.author))}</td>
      <td class="col-city ${f.city ? '' : 'muted'}">${fact(f.city)}</td>
      <td class="col-year" title="${esc(f.show)}">${esc(f.show)}</td>
      <td class="col-globe">${globeButton(f)}</td>
    </tr>
  `).join('') : `<tr class="empty-row"><td colspan="5">Ничего не найдено</td></tr>`;
  document.getElementById('filmsCount').textContent = `${sorted.length} ${pluralFilms(sorted.length)}`;

  mainEl.querySelectorAll('th[data-key]').forEach(th => {
    const on = th.dataset.key === filmsSortState.key;
    th.classList.toggle('sorted', on);
    const arrow = th.querySelector('.arrow');
    if(arrow) arrow.textContent = filmsSortState.dir === 1 ? '▲' : '▼';
  });

  mainEl.querySelectorAll('tr.film-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.globe-btn')) return; // клик по глобусу не открывает плеер
      location.hash = `#/film/${row.dataset.id}`;
    });
    row.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        location.hash = `#/film/${row.dataset.id}`;
      }
    });
  });
}

/* ================= МОДАЛЬНОЕ ОКНО ПЛЕЕРА ================= */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalBox = document.getElementById('modalBox');

function openFilm(id){
  const film = FILMS.find(f => f.id === id);
  if(!film) return;

  modalBox.innerHTML = `
    ${playerBlock(film)}
    ${filmInfoBlock(film, 'modalTitle')}
  `;
  modalBackdrop.classList.add('open');
  document.body.classList.add('modal-open');
  document.documentElement.classList.add('modal-open');
}

function closeModal(updateHash=true){
  modalBackdrop.classList.remove('open');
  modalBox.innerHTML = '';
  document.body.classList.remove('modal-open');
  document.documentElement.classList.remove('modal-open');
  if(updateHash && currentRoute()[0] === 'film'){
    location.hash = lastNonFilmHash;
  }
}
modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeModal(); });

// Кнопка "Поделиться" — на устройствах с поддержкой Web Share API открывает
// стандартное системное меню "Поделиться"; иначе просто открывает ссылку в новой вкладке
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.share-action');
  if(!btn || !navigator.share) return;
  e.preventDefault();
  navigator.share({ title: btn.dataset.shareTitle, url: btn.dataset.shareUrl }).catch(() => {});
});

// Закрывает выпадающий список показов на странице «Поток» при клике снаружи
document.addEventListener('click', (e) => {
  const openDetails = document.querySelector('.stream-filter[open]');
  if(openDetails && !openDetails.contains(e.target)){
    openDetails.removeAttribute('open');
  }
});

/* ================= СТАРТ ================= */
route();
</script>
